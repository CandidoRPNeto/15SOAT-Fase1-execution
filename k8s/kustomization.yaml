# kubectl apply -k k8s/  (deploy: scripts/deploy-kind.sh sets the image tag)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: execution
resources:
  - configmap.yaml
  - mongo.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml
images:
  - name: execution-service
    newName: ghcr.io/candidorpneto/15soat-fase1-execution
    newTag: latest
