# Banco próprio do Execution Service (MongoDB, ADR-012) — o NoSQL exigido
# pela Fase 4. Replica set de 1 nó: necessário para transações multi-documento.
# Sem autenticação: cluster kind local, Service só alcançável dentro do cluster.
apiVersion: v1
kind: Service
metadata:
  name: execution-mongo
spec:
  clusterIP: None
  selector:
    app: execution-mongo
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execution-mongo
spec:
  serviceName: execution-mongo
  replicas: 1
  selector:
    matchLabels:
      app: execution-mongo
  template:
    metadata:
      labels:
        app: execution-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
