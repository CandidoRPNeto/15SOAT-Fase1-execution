# Rotas de negócio passam pelo ForwardAuth (ADR-013): o Traefik valida o token
# no OS Service e injeta X-User-*. O Swagger fica público em /execution/api/documentation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execution-api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: forward-auth@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/executions
            pathType: Prefix
            backend: { service: { name: execution-api, port: { number: 8000 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execution-docs
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: strip-execution@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /execution
            pathType: Prefix
            backend: { service: { name: execution-api, port: { number: 8000 } } }
